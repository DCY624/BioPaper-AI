[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biopaper-ai"
version = "0.1.0"
description = "Trusted biomedical literature search for BioPaper AI"
readme = {text = "# BioPaper AI\n\nTrusted biomedical literature search.", content-type = "text/markdown"}
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "BioPaper AI Contributors"}]
dependencies = [
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28.1,<0.29",
  "defusedxml>=0.7.1,<0.8",
  "typer>=0.16,<1",
  "rich>=14,<15",
  "openai>=1.99,<2",
  "pubmed-search-mcp==0.6.2",
]

[project.scripts]
biopaper = "biopaper_ai.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-defusedxml>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/biopaper_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that call live external services"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
